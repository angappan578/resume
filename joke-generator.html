<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            margin: 30px 0;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .joke-text {
            color: #333;
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .joke-punchline {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        .joke-punchline.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .reveal-btn {
            background: #28a745;
        }

        .reveal-btn:hover {
            background: #218838;
        }

        .loading {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
        }

        .error {
            color: #dc3545;
            font-size: 1.1em;
            padding: 15px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin: 20px 0;
        }

        .joke-category {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh in seconds!</p>

        <div class="joke-box" id="jokeBox">
            <div class="loading">Click the button to get a joke!</div>
        </div>

        <div class="button-group">
            <button onclick="getJoke()">Get New Joke</button>
            <button class="reveal-btn" onclick="togglePunchline()" style="display: none;" id="revealBtn">Show Punchline</button>
        </div>

        <div id="errorBox"></div>
    </div>

    <script>
        let currentJoke = null;

        async function getJoke() {
            const jokeBox = document.getElementById('jokeBox');
            const revealBtn = document.getElementById('revealBtn');
            const errorBox = document.getElementById('errorBox');

            // Reset UI
            jokeBox.innerHTML = '<div class="loading">Loading joke...</div>';
            errorBox.innerHTML = '';
            revealBtn.style.display = 'none';

            try {
                // Fetch from Official Joke API
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                currentJoke = data;

                // Display the setup
                jokeBox.innerHTML = `
                    <div class="joke-text">${data.setup}</div>
                    <div class="joke-category">Type: ${data.type}</div>
                    <div class="joke-punchline" id="punchline">${data.punchline}</div>
                `;

                revealBtn.style.display = 'inline-block';
                revealBtn.textContent = 'Show Punchline';
                document.getElementById('punchline').classList.remove('show');

            } catch (error) {
                errorBox.innerHTML = `<div class="error">⚠️ Error: ${error.message}. Please try again!</div>`;
                jokeBox.innerHTML = '<div class="loading">Failed to load joke</div>';
            }
        }

        function togglePunchline() {
            const punchline = document.getElementById('punchline');
            const revealBtn = document.getElementById('revealBtn');

            if (punchline.classList.contains('show')) {
                punchline.classList.remove('show');
                revealBtn.textContent = 'Show Punchline';
            } else {
                punchline.classList.add('show');
                revealBtn.textContent = 'Hide Punchline';
            }
        }

        // Load a joke on page load
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
